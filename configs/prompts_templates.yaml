random_prompt_instruction: "Generate a creative, bold, original, and slightly transgressive idea for a short video of the {genre} genre. The idea must be set {setting}, {time_period}, {weather}. It features {character} as the protagonist, {twist}. The mood should be {mood}, exploring the theme of {theme}. The main conflict is {conflict}. The visual style should be {visual_style}, {camera_angles}. A key object in the scene is {object}. The inciting incident happens {random_event}. The idea must be specific, engaging, and suitable for capturing attention on TikTok/Shorts. Return only the idea, without extra text or comments. The output MUST be in {language}."
